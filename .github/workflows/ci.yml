name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  montar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Montar ejemplo y galería (valida iconos, claves, sintaxis y colores)
        run: npm run build
      - name: Prueba de interacción
        env: { CHROME: '${{ steps.chrome.outputs.chrome-path }}' }
        run: python3 kit/probar.py dist/tienda.html
